name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: alert-explainer:ci
          load: true
      - name: Smoke-test image
        run: |
          docker run -d --name ae -p 8080:8080 \
            -e ALERT_EXPLAINER_ANTHROPIC_API_KEY=dummy alert-explainer:ci
          for i in {1..15}; do
            curl -fsS http://localhost:8080/healthz && break || sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          docker logs ae
          docker rm -f ae
