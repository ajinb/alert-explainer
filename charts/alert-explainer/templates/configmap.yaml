apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alert-explainer.fullname" . }}
  labels:
    {{- include "alert-explainer.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  ALERT_EXPLAINER_{{ $key }}: {{ $value | quote }}
  {{- end }}
  ALERT_EXPLAINER_HOST: "0.0.0.0"
  ALERT_EXPLAINER_PORT: {{ .Values.service.port | quote }}
  {{- if .Values.teamContext }}
  ALERT_EXPLAINER_SYSTEM_CONTEXT_FILE: /etc/alert-explainer/team-context.md
  team-context.md: |
    {{- .Values.teamContext | nindent 4 }}
  {{- end }}
